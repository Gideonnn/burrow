<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9586"/>
      <stop offset="1" stop-color="#12504a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe6e1"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f4fffd"/>
      <stop offset="1" stop-color="#8fd6ca"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2fffc" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9fe3d8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- macOS icon grid: 824px squircle centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <ellipse cx="512" cy="500" rx="330" ry="120" fill="url(#glow)"/>
  <!-- a memory drawn out of the basin, a silver thread -->
  <path d="M512 486 C 452 430 588 392 520 330 C 470 284 580 252 540 196" fill="none" stroke="#effffb" stroke-width="22" stroke-linecap="round"/>
  <path d="M470 470 C 440 440 470 410 456 380" fill="none" stroke="#effffb" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <!-- a shallow stone basin on a pedestal -->
  <path d="M228 500 H796 C 790 576 680 628 512 628 C 344 628 234 576 228 500 Z" fill="url(#stone)"/>
  <ellipse cx="512" cy="500" rx="284" ry="62" fill="#e9f6f3"/>
  <ellipse cx="512" cy="502" rx="252" ry="48" fill="url(#pool)"/>
  <ellipse cx="512" cy="502" rx="150" ry="27" fill="none" stroke="#4fae9f" stroke-width="10" opacity="0.75"/>
  <ellipse cx="512" cy="502" rx="72" ry="13" fill="none" stroke="#4fae9f" stroke-width="8" opacity="0.75"/>
  <path d="M470 622 C 478 680 474 730 452 772 H572 C 550 730 546 680 554 622 Z" fill="url(#stone)"/>
  <rect x="392" y="764" width="240" height="40" rx="14" fill="#cfe6e1"/>
</svg>

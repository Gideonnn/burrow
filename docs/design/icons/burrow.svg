<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22305a"/>
      <stop offset="1" stop-color="#55638f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4673f"/>
      <stop offset="1" stop-color="#a9452a"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b85a40"/>
      <stop offset="1" stop-color="#963f2c"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d2c7ac"/>
      <stop offset="1" stop-color="#ab9f84"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd76e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <!-- macOS icon grid: 824px squircle centred in 1024 -->
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <g fill="#fff6dc">
      <circle cx="190" cy="220" r="5"/><circle cx="820" cy="200" r="6"/><circle cx="760" cy="300" r="4"/>
      <circle cx="230" cy="360" r="4"/><circle cx="860" cy="420" r="5"/>
    </g>
    <path d="M100 850 C 300 790 720 790 924 850 V924 H100 Z" fill="#3f6b3a"/>
  </g>

  <g transform="translate(536 548) scale(0.84) translate(-512 -500)">
  <!-- the crooked upper house, leaning on its stilts -->
  <g transform="rotate(-5 470 640)">
    <!-- chimney behind everything -->
    <rect x="478" y="150" width="62" height="470" fill="url(#brick)"/>
    <rect x="470" y="140" width="78" height="22" rx="4" fill="#8d8a86"/>
    <rect x="484" y="112" width="20" height="30" fill="#a9452a"/>
    <rect x="514" y="118" width="20" height="24" fill="#a9452a"/>

    <!-- stilts -->
    <g stroke="#5b3d25" stroke-width="16" stroke-linecap="round">
      <path d="M300 520 L 270 690"/><path d="M300 520 L 352 690"/><path d="M440 520 L 452 690"/>
    </g>

    <!-- brick wing on the right -->
    <rect x="540" y="440" width="190" height="200" fill="url(#brick)"/>
    <g stroke="#7f3324" stroke-width="5" opacity="0.6">
      <path d="M540 480 H730 M540 520 H730 M540 560 H730 M540 600 H730"/>
    </g>
    <rect x="600" y="472" width="64" height="96" rx="6" fill="#ffd36b"/>
    <path d="M632 472 V568 M600 520 H664" stroke="#7a5230" stroke-width="7"/>

    <!-- plank house -->
    <rect x="260" y="300" width="290" height="230" fill="url(#plank)"/>
    <g stroke="#8a7f66" stroke-width="5">
      <path d="M260 340 H550 M260 380 H550 M260 420 H550 M260 460 H550 M260 500 H550"/>
    </g>
    <rect x="290" y="380" width="80" height="100" rx="6" fill="#ffd36b"/>
    <path d="M330 380 V480 M290 430 H370" stroke="#7a5230" stroke-width="7"/>
    <path d="M450 470 V380 A 35 35 0 0 1 520 380 V470 Z" fill="#ffd36b"/>
    <path d="M485 345 V470 M450 415 H520" stroke="#7a5230" stroke-width="7"/>

    <!-- balcony with a dark roof -->
    <rect x="560" y="330" width="170" height="110" fill="#3b3330" opacity="0.35"/>
    <g stroke="#efe6d2" stroke-width="7">
      <path d="M560 400 H730 M580 400 V440 M610 400 V440 M640 400 V440 M670 400 V440 M700 400 V440"/>
    </g>
    <g stroke="#5b3d25" stroke-width="10"><path d="M566 330 V440 M724 330 V440"/></g>
    <path d="M548 336 L 572 290 H718 L 742 336 Z" fill="#4a4752"/>

    <!-- tower with a pointed roof, leaning the other way -->
    <g transform="rotate(7 365 310)">
    <rect x="290" y="180" width="150" height="130" fill="url(#plank)"/>
    <g stroke="#8a7f66" stroke-width="5"><path d="M290 220 H440 M290 260 H440"/></g>
    <rect x="335" y="212" width="60" height="78" rx="6" fill="#ffd36b"/>
    <path d="M365 212 V290" stroke="#7a5230" stroke-width="7"/>
    <path d="M266 196 L 365 96 L 464 196 Z" fill="url(#roof)"/>
    </g>
    <path d="M232 316 H578 L 550 290 H260 Z" fill="url(#roof)"/>
  </g>

  <!-- the low house: big tiled roof over half-timbered walls -->
  <rect x="240" y="720" width="550" height="140" fill="#eee4cc"/>
  <g stroke="#6b4a2e" stroke-width="10">
    <path d="M240 724 H790 M300 724 V860 M440 724 V860 M600 724 V860 M730 724 V860"/>
    <path d="M300 790 L 360 724 M440 790 L 380 724 M600 790 L 660 724 M730 790 L 670 724"/>
  </g>
  <ellipse cx="350" cy="800" rx="110" ry="80" fill="url(#glow)"/>
  <ellipse cx="680" cy="800" rx="110" ry="80" fill="url(#glow)"/>
  <rect x="318" y="770" width="74" height="62" rx="5" fill="#ffd36b"/>
  <rect x="628" y="770" width="104" height="62" rx="5" fill="#ffd36b"/>
  <path d="M355 770 V832 M680 770 V832" stroke="#7a5230" stroke-width="7"/>
  <path d="M482 860 V780 A 38 38 0 0 1 558 780 V860 Z" fill="#8f5f34"/>
  <path d="M190 734 L 330 616 H700 L 840 734 Z" fill="url(#roof)"/>
  <g stroke="#8c3622" stroke-width="5" opacity="0.7">
    <path d="M232 700 H798 M272 666 H758 M310 634 H720"/>
  </g>
  <!-- a dormer on the low roof -->
  <path d="M342 704 V668 L 382 632 L 422 668 V704 Z" fill="#eee4cc"/>
  <rect x="364" y="664" width="36" height="34" rx="4" fill="#ffd36b"/>
  <path d="M328 676 L 382 620 L 436 676" fill="none" stroke="#a9452a" stroke-width="16" stroke-linejoin="round"/>
  </g>
</svg>

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: ./.agents/hooks/test-hooks.sh
      - name: A second server build still finds its migrations
        run: |
          pnpm --filter @burrow/server build
          pnpm --filter @burrow/server build
          test -f apps/server/dist/migrations/meta/_journal.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    # The apps use macOS 26 APIs (Liquid Glass), which need its SDK.
    runs-on: macos-26
    # The same Xcode as the Mac that builds and releases the apps: each Swift
    # release checks concurrency differently, and the image's default moves.
    # Bump together with the local Xcode.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: BurrowKit
        working-directory: packages/burrow-kit
        run: swift build && swift test
      - name: Hedwig
        working-directory: apps/hedwig-mac
        run: swift build && swift test
      - name: Pensieve
        working-directory: apps/pensieve-mac
        run: swift build && swift test
      - name: Lumos
        working-directory: apps/lumos-mac
        run: swift build && swift test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t burrow-server .
      - name: Start the image and check /health
        run: |
          docker run -d --name burrow -p 4717:4717 -e BURROW_SECRET_KEY="$(openssl rand -base64 32)" burrow-server
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4717/health && exit 0; sleep 1; done
          docker logs burrow
          exit 1
      - name: The CLI runs inside the image
        run: docker exec burrow node dist/cli.js list

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: ./.agents/hooks/test-hooks.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/hedwig-mac
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t burrow-server .
      - name: Start the image and check /health
        run: |
          docker run -d --name burrow -p 4717:4717 -e BURROW_SECRET_KEY="$(openssl rand -base64 32)" burrow-server
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4717/health && exit 0; sleep 1; done
          docker logs burrow
          exit 1
      - name: The CLI runs inside the image
        run: docker exec burrow node dist/cli.js list
